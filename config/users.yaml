# ─────────────────────────────────────────────────────────────────
# Demo user accounts.
#
# ⚠️  For production: replace plain-text passwords with bcrypt hashes
#     and use a proper identity provider (Auth0, Cognito, LDAP, etc.)
#
# `role`   must match an entry in config/config.yaml → roles.
# `tenant` must match an entry in config/config.yaml → tenants.
#          A user whose tenant is not configured cannot sign in.
#
# These four accounts exist to demonstrate the two access boundaries:
#
#   Alice / Bob / Guest  same organisation, three clearance levels. Shows
#                        that a role controls WHICH documents you can
#                        retrieve, not merely how many chunks come back.
#   Carol                different organisation. Shows that tenancy is the
#                        harder boundary: she is an admin with full
#                        clearance and still sees nothing of the other
#                        tenant's corpus.
# ─────────────────────────────────────────────────────────────────

users:
  alice:
    password: "alice123"
    role: "admin"
    tenant: "demo"
    display_name: "Alice (Admin)"

  bob:
    password: "bob123"
    role: "support"
    tenant: "demo"
    display_name: "Bob (Support)"

  guest:
    password: "guest123"
    role: "viewer"
    tenant: "demo"
    display_name: "Guest (Viewer)"

  carol:
    password: "carol123"
    role: "admin"
    tenant: "other-org"
    display_name: "Carol (Admin — Other Organization)"
