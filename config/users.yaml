# ─────────────────────────────────────────────────────────────────
# User credentials for the RAG system demo.
#
# ⚠️  For production: replace plain-text passwords with bcrypt hashes
#     and use a proper identity provider (Auth0, Cognito, LDAP, etc.)
#
# `role`   must match an entry in config/config.yaml → roles.
# `tenant` must match an entry in config/config.yaml → tenants.
#          A user whose tenant is not configured cannot sign in.
# ─────────────────────────────────────────────────────────────────

users:
  alice:
    password: "alice123"
    role: "admin"
    tenant: "acme"
    display_name: "Alice (Acme Admin)"

  bob:
    password: "bob123"
    role: "support"
    tenant: "acme"
    display_name: "Bob (Acme Support)"

  guest:
    password: "guest123"
    role: "viewer"
    tenant: "acme"
    display_name: "Guest (Acme Viewer)"

  # Second tenant — same deployment, different corpus. Carol is an admin,
  # yet she cannot retrieve a single Acme document.
  carol:
    password: "carol123"
    role: "admin"
    tenant: "globex"
    display_name: "Carol (Globex Admin)"
